name: Set Onboarding v1 Candidate Test

on:
  push:
    branches:
      - feature/set-onboarding-v1
      - candidate/mega-evolution-base
    paths:
      - "tools/onboard_set.py"
      - "tools/create_set.py"
      - "tools/validate_set.py"
      - "schema_v1_inventory_sheet_plan.py"
      - "tools/google_sheets_test_harness_v2.gs"
      - "tools/set_templates/new_set_definition.example.json"
      - "tests/onboard_set_smoke_test.py"
      - "tests/lettered_collector_number_test.py"
      - "tests/google_sheets_test_harness_safety_test.py"
      - "candidate_sources/mega_evolution_base/**"
      - ".github/workflows/set-onboarding-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out scanner candidate
        if: github.ref == 'refs/heads/candidate/mega-evolution-base'
        uses: actions/checkout@v4
        with:
          repository: Young-nick-young/pokemon-card-scanner
          ref: candidate/mega-evolution-base
          path: scanner
      - name: Python syntax check
        run: python -m py_compile tools/onboard_set.py tools/create_set.py tools/validate_set.py
      - name: Check new-set template is valid JSON
        run: python -m json.tool tools/set_templates/new_set_definition.example.json > /dev/null
      - name: Onboarding wrapper smoke tests
        run: python tests/onboard_set_smoke_test.py
      - name: Test Sheet harness safety tests
        run: python tests/google_sheets_test_harness_safety_test.py
      - name: Lettered collector-number tests
        run: python tests/lettered_collector_number_test.py

      - name: Generate and validate Mega Evolution base candidate
        if: github.ref == 'refs/heads/candidate/mega-evolution-base'
        run: |
          python tools/create_set.py candidate_sources/mega_evolution_base/definition.json \
            --candidate-output-root generated/mega-evolution
          python tools/validate_set.py --set mega-evolution
          python -m py_compile sets/mega_evolution/runtime_metadata.py sets/mega_evolution/recognizer.py sets/mega_evolution/public_package.py main.py
          node --check < generated/mega-evolution/apps_script/mega_evolution_config.gs
          node --check generated/mega-evolution/frontend/js/sets/mega-evolution.js
          python tools/validate_inventory_sheet_v2.py --plan sets/mega_evolution/inventory_sheet_plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          cards = json.loads(Path("sets/mega_evolution/cards.json").read_text())["cards"]
          meta = json.loads(Path("sets/mega_evolution/inventory_metadata.json").read_text())["cards"]
          plan = json.loads(Path("sets/mega_evolution/inventory_sheet_plan.json").read_text())

          assert len(cards) == len(meta) == len(plan["rows"]) == 188
          assert cards[0]["cardId"] == "meg-001"
          assert cards[0]["number"] == {"namespaceId":"main","display":"001/132","sortKey":1}
          assert cards[-1]["cardId"] == "meg-188"
          assert cards[-1]["number"] == {"namespaceId":"main","display":"188/132","sortKey":188}

          counts = {
              v: sum(v in card["inventoryVariants"] for card in meta)
              for v in ("normal","reverse-holo","holo","other")
          }
          assert counts == {
              "normal":110,
              "reverse-holo":122,
              "holo":78,
              "other":0,
          }, counts

          combo_counts = {}
          for card in meta:
              key = tuple(card["inventoryVariants"])
              combo_counts[key] = combo_counts.get(key, 0) + 1
          assert combo_counts == {
              ("normal","reverse-holo"):110,
              ("reverse-holo","holo"):12,
              ("holo",):66,
          }, combo_counts

          print("PASS: Mega Evolution candidate structure")
          print("PASS:", counts)
          print("PASS:", combo_counts)
          PY
