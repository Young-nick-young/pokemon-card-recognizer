name: Mega Evolution Base Candidate Validation

on:
  push:
    branches:
      - candidate/mega-evolution-base
    paths:
      - "tools/create_set.py"
      - "tools/validate_set.py"
      - "tools/validate_inventory_sheet_v2.py"
      - "schema_v1_inventory_sheet_plan.py"
      - "schema_v1_loader.py"
      - "tools/set_templates/**"
      - "candidate_sources/mega_evolution_base/**"
      - ".github/workflows/set-onboarding-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check current onboarding tools
        run: |
          python -m py_compile \
            tools/create_set.py \
            tools/validate_set.py \
            tools/validate_inventory_sheet_v2.py \
            schema_v1_inventory_sheet_plan.py \
            schema_v1_loader.py

      - name: Generate and validate Mega Evolution base candidate
        run: |
          python tools/create_set.py candidate_sources/mega_evolution_base/definition.json \
            --candidate-output-root generated/mega-evolution
          python tools/validate_set.py --set mega-evolution
          python tools/validate_inventory_sheet_v2.py \
            --plan sets/mega_evolution/inventory_sheet_plan.json
          python -m py_compile \
            sets/mega_evolution/runtime_metadata.py \
            sets/mega_evolution/recognizer.py \
            sets/mega_evolution/public_package.py \
            main.py
          node --check < generated/mega-evolution/apps_script/mega_evolution_config.gs
          node --check generated/mega-evolution/frontend/js/sets/mega-evolution.js

      - name: Verify exact ME1 structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cards = json.loads(Path("sets/mega_evolution/cards.json").read_text())["cards"]
          meta = json.loads(Path("sets/mega_evolution/inventory_metadata.json").read_text())["cards"]
          plan = json.loads(Path("sets/mega_evolution/inventory_sheet_plan.json").read_text())

          assert len(cards) == 188
          assert len(meta) == 188
          assert len(plan["rows"]) == 188
          assert plan["endRow"] == 200

          assert cards[0]["cardId"] == "meg-001"
          assert cards[0]["number"] == {
              "namespaceId": "main",
              "display": "001/132",
              "sortKey": 1,
          }
          assert cards[-1]["cardId"] == "meg-188"
          assert cards[-1]["number"] == {
              "namespaceId": "main",
              "display": "188/132",
              "sortKey": 188,
          }

          counts = {
              v: sum(v in card["inventoryVariants"] for card in meta)
              for v in ("normal", "reverse-holo", "holo", "other")
          }
          assert counts == {
              "normal": 110,
              "reverse-holo": 122,
              "holo": 78,
              "other": 0,
          }, counts

          combos = {}
          for card in meta:
              key = tuple(card["inventoryVariants"])
              combos[key] = combos.get(key, 0) + 1
          assert combos == {
              ("normal", "reverse-holo"): 110,
              ("reverse-holo", "holo"): 12,
              ("holo",): 66,
          }, combos

          assert plan["rows"][0]["compatibilityCardId"] == "MEG-001"
          assert plan["rows"][-1]["compatibilityCardId"] == "MEG-188"

          print("PASS: 188 identities")
          print("PASS: first/last identities")
          print("PASS: inventory counts", counts)
          print("PASS: inventory combinations", combos)
          print("PASS: Sheet Plan rows 13-200")
          PY

      - name: Build ME1 shared Schema v1 SIFT library
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless==4.8.1.78 numpy==1.26.4
          python schema_v1_library_builder.py \
            --set-id mega-evolution \
            --package sets/mega_evolution \
            --expected-records 188 \
            --output sets/mega_evolution/card_library.pkl

      - name: Validate ME1 recognition library structure
        run: |
          python - <<'PY'
          import pickle
          from pathlib import Path
          import numpy as np

          path = Path("sets/mega_evolution/card_library.pkl")
          with path.open("rb") as handle:
              library = pickle.load(handle)

          assert library["card_count"] == 188
          assert list(library["cards"]) == list(range(1, 189))
          assert library["global_descriptors"].dtype == np.float32
          assert library["global_card_numbers"].dtype == np.uint16
          assert len(library["global_descriptors"]) == len(library["global_card_numbers"])
          assert len(library["global_descriptors"]) > 0

          previous_end = 0
          for number in range(1, 189):
              card = library["cards"][number]
              assert card["number"] == number
              assert card["descriptor_start"] == previous_end
              assert card["descriptor_end"] > card["descriptor_start"]
              assert len(card["keypoints"]) == card["descriptor_end"] - card["descriptor_start"]
              previous_end = card["descriptor_end"]

          assert previous_end == len(library["global_descriptors"])
          print("PASS: recognition library cards 1-188")
          print("PASS: descriptors", len(library["global_descriptors"]))
          print("PASS: descriptor dtype", library["global_descriptors"].dtype)
          print("PASS: card-number dtype", library["global_card_numbers"].dtype)
          PY

      - name: Upload ME1 candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mega-evolution-base-candidate
          path: |
            sets/mega_evolution/manifest.json
            sets/mega_evolution/cards.json
            sets/mega_evolution/inventory_metadata.json
            sets/mega_evolution/inventory_sheet_plan.json
            sets/mega_evolution/card_library.pkl
            generated/mega-evolution/apps_script/mega_evolution_config.gs
            generated/mega-evolution/frontend/js/sets/mega-evolution.js
