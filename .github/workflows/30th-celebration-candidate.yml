name: 30th Celebration Candidate Validation

on:
  push:
    branches:
      - candidate/30th-celebration-base
    paths:
      - "candidate_sources/30th_celebration_base/**"
      - "tools/create_set.py"\n      - "tools/validate_set.py"
      - "schema_v1_inventory_sheet_plan.py"
      - ".github/workflows/30th-celebration-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out scanner candidate
        uses: actions/checkout@v4
        with:
          repository: Young-nick-young/pokemon-card-scanner
          ref: candidate/30th-celebration-base
          path: scanner

      - name: Python syntax check
        run: python -m py_compile tools/create_set.py tools/validate_set.py schema_v1_inventory_sheet_plan.py

      - name: Install recognition dependencies
        run: pip install -r requirements.txt

      - name: Generate 30th Celebration candidate
        run: |
          python tools/create_set.py candidate_sources/30th_celebration_base/definition.json \
            --candidate-output-root generated/30th-celebration

      - name: Validate generated recognizer candidate
        run: |
          python tools/validate_set.py --set 30th-celebration
          python -m py_compile sets/set_30th_celebration/runtime_metadata.py sets/set_30th_celebration/recognizer.py sets/set_30th_celebration/public_package.py main.py
          node --check generated/30th-celebration/apps_script/set_30th_celebration_config.gs
          node --check generated/30th-celebration/frontend/js/sets/30th-celebration.js

      - name: Build 30th Celebration recognition library
        run: |
          python schema_v1_library_builder.py \
            --set-id 30th-celebration \
            --package sets/set_30th_celebration \
            --expected-records 161 \
            --output sets/set_30th_celebration/card_library.pkl
          python tools/validate_set.py --set 30th-celebration --require-library

      - name: Upload generated candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: 30th-celebration-candidate
          path: |
            sets/set_30th_celebration
            generated/30th-celebration
          if-no-files-found: error

      - name: Verify special collector numbers and variant authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cards = json.loads(Path("sets/set_30th_celebration/cards.json").read_text())["cards"]
          meta = json.loads(Path("sets/set_30th_celebration/inventory_metadata.json").read_text())["cards"]
          plan = json.loads(Path("sets/set_30th_celebration/inventory_sheet_plan.json").read_text())

          assert len(cards) == 161
          assert len(meta) == 161
          assert len(plan["rows"]) == 161

          assert cards[0]["cardId"] == "30c-001"
          assert cards[0]["number"]["display"] == "001/128"
          assert cards[-3]["number"]["display"] == "R/128"
          assert cards[-2]["number"]["display"] == "G/128"
          assert cards[-1]["number"]["display"] == "B/128"

          assert plan["rows"][-3]["values"]["collectorNumber"] == "R"
          assert plan["rows"][-2]["values"]["collectorNumber"] == "G"
          assert plan["rows"][-1]["values"]["collectorNumber"] == "B"

          by_id = {entry["cardId"]: entry for entry in meta}
          reverse = [entry for entry in meta if "reverse-holo" in entry["inventoryVariants"]]
          other = [entry for entry in meta if "other" in entry["inventoryVariants"]]
          holo = [entry for entry in meta if "holo" in entry["inventoryVariants"]]

          assert len(holo) == 161
          assert len(reverse) == 7
          assert len(other) == 2
          assert by_id["30c-063"]["inventoryVariants"] == ["holo", "other"]
          assert by_id["30c-116"]["inventoryVariants"] == ["holo", "other"]

          print("PASS: 161 identities")
          print("PASS: R/G/B collector numbers preserved")
          print("PASS: holo=161 reverse=7 other=2")
          PY

      - name: Final integration readiness check
        run: |
          python tools/validate_set.py \
            --set 30th-celebration \
            --frontend-root scanner \
            --apps-script-root generated/30th-celebration/apps_script \
            --require-library \
            --integration
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from onboard_set import write_readiness_report

          test_result = json.loads(
              Path("candidate_sources/30th_celebration_base/test_sheet_result.json").read_text()
          )
          status, path = write_readiness_report(
              "30th-celebration",
              True,
              Path("scanner"),
              Path("generated/30th-celebration/apps_script"),
              test_result,
              Path(".").resolve(),
              Path("generated/30th-celebration"),
          )
          print("FINAL READINESS:", status)
          print("REPORT:", path)
          if status != "READY":
              raise SystemExit("30th Celebration is not READY")
          PY

      - name: Commit validated generated candidate
        if: success()
        run: |
          rm -f sets/set_30th_celebration/card_library.pkl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sets/set_30th_celebration schema_v1_builds.json main.py generated/30th-celebration
          if git diff --cached --quiet; then
            echo "No generated candidate changes to commit."
          else
            git commit -m "Generate validated 30th Celebration candidate"
            git push
          fi
