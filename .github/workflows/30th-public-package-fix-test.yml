name: 30th Celebration Public Package Fix Test

on:
  push:
    branches:
      - candidate/30th-celebration-base
    paths:
      - ".github/workflows/30th-public-package-fix-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live 30th Celebration public package
        run: |
          python - <<'PY'
          import json, urllib.request

          url = "https://pokemon-card-recognizer.onrender.com/api/v1/sets/30th-celebration/package"
          with urllib.request.urlopen(url, timeout=60) as response:
              package = json.loads(response.read().decode("utf-8"))
              print("HTTP", response.status)

          cards = package["cards"]
          assert len(cards) == 161
          assert cards[0]["cardId"] == "30c-001"
          assert cards[-3]["number"] == {"display":"R/128","sortKey":159}
          assert cards[-2]["number"] == {"display":"G/128","sortKey":160}
          assert cards[-1]["number"] == {"display":"B/128","sortKey":161}

          counts = {
              v: sum(v in card["variants"] for card in cards)
              for v in ("normal","reverse-holo","holo","other")
          }
          assert counts == {
              "normal":0,
              "reverse-holo":7,
              "holo":161,
              "other":2,
          }, counts

          print("PASS: live public package")
          print("cards:", len(cards))
          print("last three:", [card["number"] for card in cards[-3:]])
          print("variant counts:", counts)
          PY
