name: 30th Celebration Base Holo-Only Test

on:
  push:
    branches:
      - candidate/30th-celebration-base
    paths:
      - ".github/workflows/30th-public-package-fix-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed Holo-only fix
        uses: actions/checkout@v4
        with:
          ref: fix/30th-celebration-base-holo-only

      - name: Validate authoritative metadata and public package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sets.set_30th_celebration.public_package import build_public_package

          meta = json.loads(Path("sets/set_30th_celebration/inventory_metadata.json").read_text())
          plan = json.loads(Path("sets/set_30th_celebration/inventory_sheet_plan.json").read_text())

          assert len(meta["cards"]) == 161
          assert all(card["inventoryVariants"] == ["holo"] for card in meta["cards"])

          assert len(plan["rows"]) == 161
          for row in plan["rows"]:
              assert row["inventoryVariants"] == ["holo"]
              assert row["values"]["normalQty"] is None
              assert row["values"]["reverseHoloQty"] is None
              assert row["values"]["holoQty"] == 0
              assert row["values"]["otherQty"] is None

          package = build_public_package()
          cards = package["cards"]
          assert len(cards) == 161
          assert all(card["variants"] == ["holo"] for card in cards)
          assert cards[-3]["number"] == {"display":"R/128","sortKey":159}
          assert cards[-2]["number"] == {"display":"G/128","sortKey":160}
          assert cards[-1]["number"] == {"display":"B/128","sortKey":161}

          print("PASS: 161 Holo-only base-set cards")
          print("PASS: R/G/B sort keys preserved")
          PY
