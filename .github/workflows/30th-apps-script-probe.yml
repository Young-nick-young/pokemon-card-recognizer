name: 30th Celebration Apps Script Holo-Only Probe

on:
  push:
    branches:
      - candidate/30th-celebration-base
    paths:
      - ".github/workflows/30th-apps-script-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify cards route and unavailable Reverse Holo write
        env:
          SCRIPT_URL: "https://script.google.com/a/macros/ikns.edu.bh/s/AKfycbxzaDPrnUX_a8P7UXxAQ-lWCCbJ9RG_kiXzvUfERWk41cCDhdY5yIr8S1PK9CAD10vv/exec"
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request, os, uuid

          base = os.environ["SCRIPT_URL"]

          def jsonp(params):
              params = dict(params)
              params["callback"] = "probe"
              params["_"] = "30c-holo-only-check"
              url = base + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  match = re.fullmatch(r"\s*probe\((.*)\)\s*;?\s*", body, re.S)
                  if not match:
                      raise SystemExit("Response was not JSONP: " + body[:500])
                  return json.loads(match.group(1))

          cards = jsonp({
              "api": "cards",
              "setId": "30th-celebration",
          })
          assert isinstance(cards, list) and len(cards) == 161
          assert cards[56]["cardId"] == "30c-057"

          result = jsonp({
              "api": "changeQuantity",
              "setId": "30th-celebration",
              "cardId": "30c-057",
              "variantId": "reverse-holo",
              "quantityDelta": "1",
              "transactionId": "holo-only-probe-" + str(uuid.uuid4()),
          })

          print("reverse-holo probe:", result)

          if not isinstance(result, dict) or result.get("success") is not False:
              raise SystemExit("Expected Reverse Holo write to be rejected.")

          if "unavailable" not in str(result.get("error", "")).lower():
              raise SystemExit("Expected unavailable-variant error.")

          print("PASS: 30th Celebration remains 161 cards")
          print("PASS: Zeraora 057 Reverse Holo write is rejected as unavailable")
          PY
