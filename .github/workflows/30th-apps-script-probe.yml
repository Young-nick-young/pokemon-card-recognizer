name: 30th Celebration Apps Script Read-Only Probe

on:
  push:
    branches:
      - candidate/30th-celebration-base
    paths:
      - ".github/workflows/30th-apps-script-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe existing and new set routes
        env:
          SCRIPT_URL: "https://script.google.com/a/macros/ikns.edu.bh/s/AKfycbxzaDPrnUX_a8P7UXxAQ-lWCCbJ9RG_kiXzvUfERWk41cCDhdY5yIr8S1PK9CAD10vv/exec"
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request, os

          base = os.environ["SCRIPT_URL"]

          def probe(set_id):
              params = urllib.parse.urlencode({
                  "api": "cards",
                  "callback": "probe",
                  "setId": set_id,
                  "_": "30c-post-deploy-check",
              })
              url = base + "?" + params
              with urllib.request.urlopen(url, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  print(f"{set_id}: HTTP {response.status}, bytes={len(body)}")
                  match = re.fullmatch(r"\s*probe\((.*)\)\s*;?\s*", body, re.S)
                  if not match:
                      raise SystemExit(f"{set_id}: response was not JSONP")
                  return json.loads(match.group(1))

          existing = probe("perfect-order")
          if not isinstance(existing, list) or len(existing) != 124:
              raise SystemExit(f"Perfect Order regression check failed: {type(existing).__name__} / {len(existing) if isinstance(existing,list) else existing}")

          candidate = probe("30th-celebration")
          if isinstance(candidate, dict) and candidate.get("success") is False:
              raise SystemExit("30th Celebration backend returned error: " + str(candidate))
          if not isinstance(candidate, list):
              raise SystemExit("30th Celebration cards response is not an array.")

          print("30th Celebration cards:", len(candidate))
          print("first:", candidate[0] if candidate else None)
          print("last:", candidate[-1] if candidate else None)

          ids = [str(card.get("legacyCardId") or card.get("cardId") or "") for card in candidate if isinstance(card, dict)]

          if len(candidate) != 161:
              raise SystemExit(f"Expected 161 cards, got {len(candidate)}")
          if "30C-001" not in ids or "30C-161" not in ids:
              raise SystemExit("Expected 30C-001 and 30C-161 were not returned.")

          print("PASS: live Apps Script route for 30th-celebration is correct.")
          PY
