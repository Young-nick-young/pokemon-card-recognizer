name: Hybrid recognition candidate
on:
  push:
    branches: [feature/recognition-performance-v1]
    paths:
      - tools/benchmark_hybrid_screening.py
      - .github/workflows/hybrid-recognition.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install opencv-python-headless==4.8.1.78 numpy==1.26.4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: python tools/benchmark_hybrid_screening.py
